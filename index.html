<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Car - Online Car Sale</title>
    <style>
        /* Basic style reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 1. Set background image */
            background: url('porsche.png') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            min-height: 100vh;
        }

        .site-header {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem 0;
            backdrop-filter: blur(5px);
        }

        /* 修改后的页眉容器样式 */
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between; /* 使标题靠左，导航靠右 */
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            /* 表单主体依然保持左对齐 */
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        /* 3. Form wrapper styles with glassmorphism */
        .form-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
        }

        h2 { margin-bottom: 10px; color: #1a1a1a; }
        .subtitle { margin-bottom: 30px; color: #666; font-size: 0.9rem; }

        /* Internal form layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }

        label { margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #007bff; }

        /* Upload box styles */
        .file-upload-box {
            border: 2px dashed #bbb;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: #f9f9f9;
            cursor: pointer;
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            flex: 2;
        }

        .btn-secondary {
            background: #eee;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }

        nav a { color: #fff; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { text-decoration: underline; }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container { justify-content: center; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <h1>AutoMart</h1>
            <nav><a href="#">Back to Seller Dashboard</a></nav>
        </div>
    </header>

    <main class="container">
        <section class="form-wrapper">
            <h2>List Your Vehicle</h2>
            <p class="subtitle">Provide details to help buyers find your car quickly.</p>
            
            <form id="addCarForm" action="#" method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="model">Car Model</label>
                        <input type="text" id="model" name="model" placeholder="e.g. Porsche 718" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Manufacturing Year</label>
                        <input type="number" id="year" name="year" placeholder="2024" min="1900" max="2026" required>
                    </div>

                    <div class="form-group">
                        <label for="color">Exterior Colour</label>
                        <input type="text" id="color" name="color" placeholder="Racing Yellow" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="Beijing" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="price">Price (¥)</label>
                        <input type="number" id="price" name="price" placeholder="Enter amount" min="0" required>
                    </div>

                    <div class="form-group full-width upload-group">
                        <label for="image">Car Image</label>
                        <div class="file-upload-box">
                            <input type="file" id="image" name="image" accept="image/png, image/jpeg" required>
                            <p class="upload-hint" style="font-size: 0.8rem; color: #777; margin-top: 5px;">Click to upload (JPG/PNG)</p>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Confirm & Publish</button>
                    <button type="reset" class="btn-secondary">Reset</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
